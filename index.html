<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APA</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" aria-label="Bunga tulip membentuk hati"></canvas>
<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W, H, dpr, parts = [], t0 = 0;
  var N = 72, FLY = 1800, STAGGER = 55;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function heart(t) {
    return {
      x: 16 * Math.pow(Math.sin(t), 3),
      y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
    };
  }
  function ease(p) { return 1 - Math.pow(1 - p, 3); }

  function build() {
    var s = Math.min(W / 38, H / 36);
    var size = Math.max(18, s * 2.4);
    var cx = W / 2, cy = H / 2 + s * 0.5;
    parts = [];
    for (var i = 0; i < N; i++) {
      var p = heart((i / N) * Math.PI * 2);
      var a = Math.random() * Math.PI * 2;
      var d = Math.max(W, H) * (0.6 + Math.random() * 0.4);
      parts.push({
        tx: cx + p.x * s, ty: cy + p.y * s,
        sx: cx + Math.cos(a) * d, sy: cy + Math.sin(a) * d,
        delay: Math.random() * N * STAGGER,
        spin: (Math.random() - 0.5) * 8,
        size: size
      });
    }
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function draw(now) {
    var el = now - t0;
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < parts.length; i++) {
      var q = parts[i];
      var p = reduce ? 1 : Math.min(1, Math.max(0, (el - q.delay) / FLY));
      if (p <= 0) continue;
      var e = ease(p);
      var x = q.sx + (q.tx - q.sx) * e;
      var y = q.sy + (q.ty - q.sy) * e;
      ctx.save();
      ctx.globalAlpha = Math.min(1, p * 3);
      ctx.translate(x, y);
      ctx.rotate(q.spin * (1 - e));
      ctx.scale(0.4 + 0.6 * e, 0.4 + 0.6 * e);
      ctx.font = q.size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText('🌷', 0, 0);
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }

  function replay() { t0 = performance.now(); build(); }

  window.addEventListener('resize', resize);
  cv.addEventListener('click', replay);
  resize();
  t0 = performance.now();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
